[project]
name = "open-fmind"
version = "0.1.0"
description = "Parcellated and denoised fMRI timeseries from OpenNeuro, one subject at a time"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Carlo Alberto Barbano" }]
requires-python = ">=3.12"
dependencies = [
    "nibabel>=5.0",
    "nilearn>=0.13.1",
    "niquests>=3.0",
    "numpy>=1.26",
    "openneuro-py>=2026.7.1",
    "pandas>=3.0.1",
]

[project.urls]
Repository = "https://github.com/carloalbertobarbano/open-fmind"

[project.scripts]
open-fmind = "open_fmind.cli:main"

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/open_fmind"]
